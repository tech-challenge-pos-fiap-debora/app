name: Publish ECR

# Publica as imagens da API e das migrations no ECR e dispara o deploy no EKS.
# Precisa rodar depois do apply do infra-kubernetes, que e quem cria os repositorios.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-ecr
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  API_REPOSITORY: tech-challenge-api
  MIGRATIONS_REPOSITORY: tech-challenge-api-migrations
  INFRA_REPOSITORY: infra-kubernetes

jobs:
  publish:
    name: Build e push das imagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push da imagem de migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.MIGRATIONS_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.MIGRATIONS_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar deploy no EKS
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "INFRA_DISPATCH_TOKEN nao configurado; deploy no EKS nao foi disparado."
            echo "Rode manualmente o workflow Deploy Prod em ${INFRA_REPOSITORY} com api_image_tag=${GITHUB_SHA}."
            exit 0
          fi
          gh workflow run deploy-prod.yml \
            --repo "${GITHUB_REPOSITORY_OWNER}/${INFRA_REPOSITORY}" \
            -f api_image_tag="${GITHUB_SHA}"

      - name: Resumo
        run: |
          {
            echo "## Imagens publicadas"
            echo
            echo "- \`${API_REPOSITORY}:${GITHUB_SHA}\`"
            echo "- \`${MIGRATIONS_REPOSITORY}:${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
